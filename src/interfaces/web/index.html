<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI/UX App Designer</title>
<script>
// Replace deprecated Range.prototype.expand with Selection.modify so browser scripts/extensions never trigger deprecation warnings
if (typeof Range !== 'undefined' && Range.prototype && 'expand' in Range.prototype) {
  Range.prototype.expand = function expandViaSelectionModify(unit = 'word') {
    const sel = typeof window !== 'undefined' && window.getSelection ? window.getSelection() : null;
    if (!sel) return;
    try {
      sel.removeAllRanges();
      sel.addRange(this);
      if (typeof sel.modify === 'function') {
        sel.modify('move', 'backward', unit);
        sel.modify('extend', 'forward', unit);
        if (sel.rangeCount > 0) {
          const r = sel.getRangeAt(0);
          this.setStart(r.startContainer, r.startOffset);
          this.setEnd(r.endContainer, r.endOffset);
        }
      }
    } catch { /* ignore */ }
  };
}
</script>
<link rel="stylesheet" href="/css/app.css?v=20261108h">
<link rel="stylesheet" href="/css/health.css?v=20261107a">
</head>
<body>
<div id="app">
  <header id="topbar" role="menubar"></header>
  <nav id="typebar" class="typebar" aria-label="Designer pages"></nav>
  <div id="body">
    <aside id="left" aria-label="Libraries and catalog"></aside>
    <div id="split-left" class="splitter" title="Drag to resize · double-click to collapse"></div>
    <main id="right" aria-label="Designer"></main>
  </div>
  <footer id="statusbar"></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="sprite-host" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></div>

</body>
</html>
